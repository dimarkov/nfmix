# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
-   repo: https://github.com/psf/black
    rev: 24.4.2 # Use a recent stable version
    hooks:
    -   id: black
        language_version: python3 # Specify your python version if needed
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Optional: specify fixed version to avoid quiet updates
    rev: v0.4.4 # Use a recent stable version
    hooks:
    # Run the linter.
    -   id: ruff
        args: [--fix] # Automatically fix issues
    # Run the formatter.
    -   id: ruff-format
